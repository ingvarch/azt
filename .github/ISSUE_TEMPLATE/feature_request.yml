name: Feature request
description: Something azt should do and does not.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What you want to do
      description: The task in Azure, not the key or the screen. For example, "see which VMs in all subscriptions are stopped but not deallocated".
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it now
      description: With the az command, the portal, or not at all.
  - type: textarea
    id: idea
    attributes:
      label: How azt could do it
      description: A key, a column, a screen. Leave it empty if you do not know.
