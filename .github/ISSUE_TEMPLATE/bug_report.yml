name: Bug report
description: Something in azt does not work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. azt
        2. :vm
        3. ...
    validations:
      required: true
  - type: input
    id: azt-version
    attributes:
      label: azt version
      description: The output of `azt --version`.
      placeholder: azt v0.1.0 (df1b55f), built 2026-10-15T10:00:00Z
    validations:
      required: true
  - type: input
    id: az-version
    attributes:
      label: Azure CLI version
      description: The `azure-cli` line of `az version`.
      placeholder: 2.80.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS and terminal
      placeholder: macOS 26, Ghostty
    validations:
      required: true
  - type: textarea
    id: screen
    attributes:
      label: Screen or logs
      description: A screenshot or the text on the screen. Remove subscription IDs and names you do not want public.
