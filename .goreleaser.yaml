# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: azt

# The licenses of what azt links ask for their texts in every copy. This also
# fails on a license azt does not allow.
before:
  hooks:
    - go run ./internal/licenses/cmd/licenses -notices THIRD_PARTY_NOTICES ./cmd/azt

builds:
  - main: ./cmd/azt
    binary: azt
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ingvarch/azt/internal/version.Version=v{{ .Version }}
      - -X github.com/ingvarch/azt/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/ingvarch/azt/internal/version.Date={{ .Date }}
    # The same list as internal/licenses.Platforms. arm is v7, the level Go
    # picks when it cross-compiles.
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0
      - linux_arm_7
      - darwin_amd64_v1
      - darwin_arm64_v8.0
      - windows_amd64_v1
      - windows_arm64_v8.0
      - freebsd_amd64_v1

archives:
  # A zip for Windows, a tarball everywhere else.
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: THIRD_PARTY_NOTICES

# Keyless: the signature names the release workflow of this repository, which
# `cosign verify-blob` checks. See SECURITY.md.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

sboms:
  - artifacts: archive

# Gatekeeper runs a downloaded binary only once Apple has notarized it. A
# snapshot has no Apple keys, a release fails without them.
notarize:
  macos:
    - enabled: "{{ not .IsSnapshot }}"
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

changelog:
  use: github-native

release:
  prerelease: auto
  extra_files:
    - glob: THIRD_PARTY_NOTICES

nfpms:
  - vendor: Igor Churmeev
    maintainer: Igor Churmeev <ingvarch@gmail.com>
    homepage: &homepage https://github.com/ingvarch/azt
    description: &description Terminal UI for Azure
    license: &license MIT
    file_name_template: "{{ .ConventionalFileName }}"
    formats:
      - deb
      - rpm
    contents:
      - src: LICENSE
        dst: /usr/share/doc/azt/LICENSE
      - src: THIRD_PARTY_NOTICES
        dst: /usr/share/doc/azt/THIRD_PARTY_NOTICES

homebrew_casks:
  - homepage: *homepage
    description: *description
    license: *license
    skip_upload: auto
    repository:
      owner: ingvarch
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
